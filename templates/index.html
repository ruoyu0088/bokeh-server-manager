<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ app_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Server management sidebar" data-i18n-aria-label="sidebar.aria">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-title">Bokeh Server Manager</span>
        </div>
        <button class="icon-button icon-button-small" id="sidebar-collapse" type="button" title="Collapse sidebar (Ctrl+B)" aria-label="Collapse sidebar" data-i18n-title="sidebar.collapseTitle" data-i18n-aria-label="sidebar.collapseTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
        </button>
      </div>

      <div class="sidebar-toolbar">
        <div class="sidebar-heading">
          <h2 data-i18n="sidebar.servers">Bokeh Servers</h2>
          <span class="server-count" id="server-count">0</span>
        </div>
        <div class="sidebar-tools">
          <button class="button button-primary button-compact" id="new-server-btn" type="button" title="Create a new Bokeh server" data-i18n-title="sidebar.newTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="sidebar.new">New</span>
          </button>
          <button class="icon-button icon-button-small" id="refresh-servers" type="button" title="Refresh server list" aria-label="Refresh server list" data-i18n-title="sidebar.refreshTitle" data-i18n-aria-label="sidebar.refreshTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
          </button>
        </div>
      </div>

      <div class="server-list" id="server-list" aria-live="polite"></div>

      <div class="sidebar-footer">
        <div class="footer-row">
          <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle light / dark theme" data-i18n-title="theme.toggleTitle">
            <span id="theme-icon" aria-hidden="true"></span>
            <span id="theme-label">Light theme</span>
          </button>
          <label class="language-picker" title="Language" data-i18n-title="sidebar.language">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            <select id="language-select" aria-label="Language" data-i18n-aria-label="sidebar.language">
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
              <option value="ja">日本語</option>
            </select>
          </label>
        </div>
        <div class="footer-row">
          <div class="connection-status" id="manager-status" title="Manager connection status" data-i18n-title="sidebar.connectionTitle">
            <span class="status-dot status-running"></span>
            <span data-i18n="sidebar.connected">Connected</span>
          </div>
          <span class="shortcut-hint" title="Show / hide sidebar" data-i18n-title="sidebar.shortcutTitle">Ctrl+B</span>
        </div>
      </div>

      <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize sidebar; double-click to reset" data-i18n-title="sidebar.resizeTitle" role="separator" aria-orientation="vertical"></div>
    </aside>

    <main class="main">
      <div class="tabbar" id="tabbar">
        <div class="tabs" id="tabs" role="tablist" aria-label="Open Bokeh servers" data-i18n-aria-label="tabs.aria"></div>
        <div class="tabbar-spacer" aria-hidden="true"></div>
      </div>
      <div class="workspace" id="workspace">
        <div class="empty-state" id="empty-state">
          <div class="empty-state-card">
            <div class="empty-illustration" aria-hidden="true">
              <span class="bubble bubble-a"></span>
              <span class="bubble bubble-b"></span>
              <span class="bubble bubble-c"></span>
            </div>
            <h1 data-i18n="empty.title">Open a Bokeh server</h1>
            <p data-i18n="empty.body">Start a server from the sidebar and its UI will open here in a tab. You can keep several servers open at once.</p>
            <p class="empty-shortcut" data-i18n-html="empty.shortcut">Press <kbd>Ctrl</kbd> + <kbd>B</kbd> to show or hide the sidebar.</p>
          </div>
        </div>
        <div class="panes" id="panes"></div>
      </div>
    </main>
  </div>

  <button class="sidebar-handle" id="sidebar-handle" type="button" title="Show sidebar (Ctrl+B)" aria-label="Show sidebar" data-i18n-title="sidebar.expandTitle" data-i18n-aria-label="sidebar.expandTitle" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
  </button>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
