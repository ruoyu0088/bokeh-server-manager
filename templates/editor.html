<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ app_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/codemirror/lib/codemirror.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/codemirror/addon/fold/foldgutter.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/codemirror/theme/material-darker.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/editor.css') }}">
</head>
<body>
  <div class="editor-shell">
    <header class="editor-header">
      <div class="editor-server">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <div class="editor-server-text">
          <strong id="server-title" data-i18n="editor.loading">Loading…</strong>
          <span id="server-name" data-i18n="editor.subtitle">Source editor</span>
        </div>
      </div>
      <div class="editor-file-heading">
        <span id="file-path" data-i18n="editor.noFile">No file open</span>
        <span class="badge" id="managed-badge" data-i18n="editor.autoBadge" hidden>auto</span>
        <span class="badge badge-meta" id="metadata-badge" data-i18n="editor.metaBadge" hidden>meta</span>
        <span class="dirty-dot" id="dirty-dot" data-i18n-title="editor.unsavedTitle" hidden title="Unsaved changes"></span>
      </div>
      <div class="editor-actions">
        <span class="save-state" id="save-state" data-i18n="editor.ready">Ready</span>
        <button class="icon-button icon-button-small" id="refresh-tree" type="button" title="Refresh file tree" aria-label="Refresh file tree" data-i18n-title="editor.refreshTree" data-i18n-aria-label="editor.refreshTree">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
        </button>
        <button class="button button-primary button-compact" id="save-file" type="button" data-i18n="editor.save" disabled>Save</button>
      </div>
    </header>

    <div class="editor-body">
      <aside class="editor-sidebar" aria-label="Files" data-i18n-aria-label="editor.files">
        <div class="editor-sidebar-head">
          <span data-i18n="editor.files">Files</span>
          <div class="editor-sidebar-tools">
            <span class="file-count" id="file-count"></span>
            <button class="icon-button icon-button-small" id="new-file" type="button" title="New file" aria-label="New file" data-i18n-title="editor.newFile" data-i18n-aria-label="editor.newFile">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="icon-button icon-button-small" id="delete-file" type="button" title="Delete file" aria-label="Delete file" data-i18n-title="editor.deleteFile" data-i18n-aria-label="editor.deleteFile" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
        </div>
        <div class="file-tree" id="file-tree"></div>
        <div class="editor-sidebar-foot">
          <span id="tree-status" data-i18n="editor.loadingFiles">Loading files…</span>
        </div>
      </aside>

      <main class="editor-main">
        <div class="editor-host-wrap">
          <div class="editor-host" id="editor-host"></div>
          <div class="editor-empty" id="editor-empty">
            <strong data-i18n="editor.selectFile">Select a file</strong>
            <span data-i18n="editor.selectFileHint">Choose a file from the tree to start editing.</span>
          </div>
          <div class="editor-error" id="editor-error" hidden></div>
        </div>
        <div class="editor-statusbar">
          <span id="cursor-pos" data-i18n="editor.cursorInitial">Ln 1, Col 1</span>
          <span id="selection-info"></span>
          <span class="statusbar-spacer"></span>
          <span id="file-mode" data-i18n="editor.plainText">Plain text</span>
          <span data-i18n="editor.utf8">UTF-8</span>
          <span data-i18n="editor.ctrlSave">Ctrl+S to save</span>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/lib/codemirror.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/mode/xml/xml.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/mode/javascript/javascript.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/mode/css/css.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/mode/htmlmixed/htmlmixed.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/mode/python/python.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/mode/yaml/yaml.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/mode/markdown/markdown.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/edit/closebrackets.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/edit/matchbrackets.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/selection/active-line.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/fold/foldcode.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/fold/foldgutter.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/fold/brace-fold.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/fold/comment-fold.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/fold/indent-fold.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/codemirror/addon/fold/xml-fold.js') }}"></script>
  <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>
</html>
